name: ModularGuard
description: Analyze and enforce modular architecture boundaries in your codebase

inputs:
  directory:
    description: 'Directory to analyze'
    required: false
    default: '.'
  token:
    description: 'GitHub token for API access'
    required: true
    default: ${{ github.token }}
  modularguard-version:
    description: 'ModularGuard version to use: a release version without the v prefix, or latest'
    required: false
    # renovate: modularguard
    default: '0.0.14'
  config-path:
    description: 'Path to ModularGuard configuration file'
    required: false

outputs:
  violations-count:
    description: 'Total number of violations found'
  error-count:
    description: 'Number of error-level violations'
  warning-count:
    description: 'Number of warning-level violations'
  status:
    description: 'Analysis status: success or failure'

runs:
  using: 'node24'
  main: 'dist/index.js'

branding:
  icon: 'shield'
  color: 'blue'
